# Pehle secret banao (file me credentials mat rakho):
# kubectl create secret generic fileapp-secret --from-literal=DB_PASSWORD=ChangeMe123 --from-literal=JWT_SECRET=xxxx --from-literal=S3_BUCKET=your-bucket --from-literal=AWS_REGION=ap-south-1 --from-literal=AWS_ACCESS_KEY_ID=xxx --from-literal=AWS_SECRET_ACCESS_KEY=xxx
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mysql-pvc}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mysql}
spec:
  replicas: 1
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
      - name: mysql
        image: mysql:8
        env:
        - {name: MYSQL_DATABASE, value: fileapp}
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: fileapp-secret, key: DB_PASSWORD}}
        ports: [{containerPort: 3306}]
        volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: mysql-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: mysql}
spec: {selector: {app: mysql}, ports: [{port: 3306}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: backend
        image: DOCKERHUB_USER/fileapp-backend:latest
        envFrom: [{secretRef: {name: fileapp-secret}}]
        env: [{name: DB_HOST, value: mysql}]
        ports: [{containerPort: 5000}]
        readinessProbe: {httpGet: {path: /api/health, port: 5000}, initialDelaySeconds: 10, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /api/health, port: 5000}, initialDelaySeconds: 30, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec: {selector: {app: backend}, ports: [{port: 5000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - {name: frontend, image: "DOCKERHUB_USER/fileapp-frontend:latest", ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec: {type: NodePort, selector: {app: frontend}, ports: [{port: 80, targetPort: 80, nodePort: 30080}]}
